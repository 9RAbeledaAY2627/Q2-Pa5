<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">




     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>




</head>
<body>
    <div class="container">




         <form action="" method="post">




        <h2 class="text-center text-primary">Sneaker Order Form</h2>




        <label for="form-name" class="form-label">Name:</label> 
        <input type="text" name="username" id="form-name" class="form-control">
    
        <label for="form-email" class="form-label">Email:</label> 
        <input type="email" name="emailaddress" id="form-email"class="form-control">




        <label for="form-tel" class="form-label">Telephone:</label> 
        <input type="tel" name="telephone" id="form-tel"class="form-control">




        <label for="form-story" class="form-label">Tell us about yourself:</label> 
        <textarea name="story" maxlength="600" id="form-story" placeholder="No more than 600 characters long" class="form-control"></textarea>
        
        <label for="sizes">Size:</label>
        <select name="size" id="sizes" class="form-select">
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
        </select> 
        
        <em>Sizes reflect standard US men's sizes</em>
            
        <label for="colors">Sneaker Color:</label>
       <div class="form-check">
  <input type="radio" class="form-check-input" id="radio1" name="optradio" value="option1">Red
  <label class="form-check-label" for="radio1"></label>
</div>
<div class="form-check">
  <input type="radio" class="form-check-input" id="radio2" name="optradio" value="option2">Blue
  <label class="form-check-label" for="radio2"></label>
</div>
<div class="form-check">
  <input type="radio" class="form-check-input" id="radio3" name="optradio" value="option3">Black
  <label class="form-check-label"></label>
</div>
<div class="form-check">
  <input type="radio" class="form-check-input" id="radio3" name="optradio" value="option4">Silver
  <label class="form-check-label"></label>
</div>
            
      <label for="features"></label>
        <fieldset id="features">
            <legend>Add-on Features</legend>
            <div class="form-check">
                <label><input type="checkbox" name="feature" value="laces" class="form-check-input"> Sparkley laces</label>
            </div>
            <div class="form-check">
                <label><input type="checkbox" name="feature" value="logo" class="form-check-input"> Metallic logo</label>
            </div>
            <div class="form-check">
                <label><input type="checkbox" name="feature" value="heels" class="form-check-input"> Light-up heels</label>
            </div>
            <div class="form-check">
                <label><input type="checkbox" name="feature" value="mp3" class="form-check-input"> MP3-enabled</label>
            </div>
        </fieldset>
        <br>
            
        <input type="submit" value="ENTER" class="btn btn-primary">
    </form>
    </div>
    
   
</body>
</html>
